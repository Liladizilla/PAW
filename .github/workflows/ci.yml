name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, architecture/system-blueprint]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Typecheck, tests, build and desktop smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Electron renderer and WebGL smoke test
        run: npm run test:desktop-smoke
      - name: Build Linux desktop package
        run: npx electron-builder --linux deb --publish never
      - name: Validate packaged Electron entry points
        shell: bash
        run: |
          set -euo pipefail
          package="$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          dpkg-deb --extract "$package" "$root"
          find "$root" -type f -name 'index.js' -path '*/out/main/*' -print -quit | grep -q .
          find "$root" -type f -name 'index.cjs' -path '*/out/preload/*' -print -quit | grep -q .
          find "$root" -type f -path '*/out/renderer/index.html' -print -quit | grep -q .
          find "$root" -type f -name 'paw-icon.png' -print -quit | grep -q .
          echo 'Linux package contains the main process, CommonJS preload, renderer entry and P.A.W. icon.'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: paw-linux-deb-${{ github.sha }}
          path: release/*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: paw-build-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7
