name: Package desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Launch Electron and wait for renderer readiness
        run: npm run test:desktop-smoke
  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: npm run package:linux
          - os: windows-latest
            platform: win
            command: npm run package:windows
          - os: macos-latest
            platform: mac
            command: npm run package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and package
        run: ${{ matrix.command }}
      - name: Verify required native installers
        run: node scripts/verify-release-artifacts.mjs ${{ matrix.platform }} release
      - name: Generate SHA-256 checksums
        run: node scripts/write-checksums.mjs release
      - name: Verify generated checksums
        run: npm run verify:checksums
      - name: Keep per-platform checksum validation out of merged artifact set
        shell: bash
        run: rm release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paw-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate release-wide SHA-256 checksums
        run: node scripts/write-checksums.mjs release-assets
      - name: Verify every published artifact checksum
        run: node scripts/verify-checksums.mjs release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
