name: Package desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish installers to the GitHub Releases tab after packaging'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag to publish, for example v0.1.4 (must match package.json)'
        required: false
        type: string
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native-package-check')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: npm run package:linux
            platform: linux
          - os: windows-latest
            command: npm run package:windows
            platform: win
          - os: macos-latest
            command: npm run package:mac
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
      - name: Build and package
        run: ${{ matrix.command }}
      - name: Verify required installer artifacts
        run: node scripts/verify-release-artifacts.mjs ${{ matrix.platform }} release
      - uses: actions/upload-artifact@v4
        with:
          name: paw-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate and verify release checksums
        run: |
          cd release-assets
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
